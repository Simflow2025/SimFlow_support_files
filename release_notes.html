<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimFlow Release Notes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000000;
      color: #d6d6d6;
      font-family: Arial, Helvetica, sans-serif;
    }

    .release-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 4px 2px 8px 2px;
    }

    .version-line {
      text-align: center;
      margin: 4px 0 12px 0;
      color: #777777;
      font-size: 12px;
    }

    .version-line strong {
      color: #dadada;
      font-weight: 600;
    }

    .whats-new {
      position: relative;
      background: linear-gradient(135deg, #171717, #111111);
      border: 1px solid #303030;
      border-radius: 9px;
      padding: 16px 20px 14px 20px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .whats-new::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #ec6702;
    }

    .whats-new-header {
      display: flex;
      align-items: center;
      margin-bottom: 11px;
    }

    .new-badge {
      background: #ec6702;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 4px;
      margin-right: 9px;
      letter-spacing: 0.4px;
    }

    .whats-new-title {
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
    }

    .highlight {
      display: grid;
      grid-template-columns: minmax(155px, 190px) 1fr;
      gap: 12px;
      padding: 5px 0;
      font-size: 13px;
      line-height: 1.45;
    }

    .highlight-title {
      color: #eeeeee;
      font-weight: 600;
    }

    .highlight-description {
      color: #aaaaaa;
    }

    details {
      background: #101010;
      border: 1px solid #2a2a2a;
      border-radius: 9px;
      overflow: hidden;
    }

    summary {
      cursor: pointer;
      padding: 12px 16px;
      color: #bdbdbd;
      font-size: 13px;
      font-weight: 600;
      user-select: none;
      outline: none;
    }

    summary:hover {
      color: #ffffff;
    }

    .history-content {
      padding: 0 18px 14px 18px;
    }

    .release {
      padding: 12px 0 6px 0;
    }

    .release-title {
      color: #eeeeee;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .current-label {
      display: inline-block;
      margin-left: 7px;
      padding: 2px 5px;
      font-size: 9px;
      border-radius: 3px;
      background: #303030;
      color: #bbbbbb;
      vertical-align: 2px;
    }

    ul {
      margin: 5px 0 0 17px;
      padding: 0;
    }

    li {
      color: #999999;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 3px;
    }

    hr {
      border: none;
      border-top: 1px solid #272727;
      margin: 10px 0 0 0;
    }

    .status {
      text-align: center;
      padding: 14px;
      color: #666666;
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .highlight {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }
  </style>
</head>

<body>
  <div id="release-container" class="release-container">
    <div class="status">Loading release information...</div>
  </div>

  <script>
    const RELEASE_NOTES_URL = "./release_notes.json";

    function escapeHtml(value) {
      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadReleaseNotes() {
      const container = document.getElementById("release-container");

      try {
        const response = await fetch(
          RELEASE_NOTES_URL + "?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        const currentVersion = data.current_version || "";
        const lastUpdate = data.last_update || "";
        const releases = Array.isArray(data.releases) ? data.releases : [];

        const currentRelease = releases.find(function (release) {
          return release.version === currentVersion;
        });

        let content = "";

        if (currentVersion || lastUpdate) {
          content +=
            '<div class="version-line">' +
              'Version <strong>' + escapeHtml(currentVersion) + '</strong>' +
              '&nbsp;&nbsp;•&nbsp;&nbsp;' +
              'Last updated <strong>' + escapeHtml(lastUpdate) + '</strong>' +
            '</div>';
        }

        if (currentRelease) {
          content +=
            '<div class="whats-new">' +
              '<div class="whats-new-header">' +
                '<span class="new-badge">NEW</span>' +
                '<span class="whats-new-title">What\'s New in ' +
                  escapeHtml(currentVersion) +
                '</span>' +
              '</div>';

          const highlights = Array.isArray(currentRelease.highlights)
            ? currentRelease.highlights
            : [];

          highlights.forEach(function (item) {
            const title = item && item.title ? item.title : "";
            const description = item && item.description ? item.description : "";

            content +=
              '<div class="highlight">' +
                '<div class="highlight-title">' +
                  escapeHtml(title) +
                '</div>' +
                '<div class="highlight-description">' +
                  escapeHtml(description) +
                '</div>' +
              '</div>';
          });

          content += '</div>';
        }

        if (releases.length > 0) {
          content +=
            '<details>' +
              '<summary>Version History</summary>' +
              '<div class="history-content">';

          releases.forEach(function (release, index) {
            const version = release && release.version ? release.version : "";
            const date = release && release.date ? release.date : "";
            const isCurrent = version === currentVersion;

            content +=
              '<div class="release">' +
                '<div class="release-title">' +
                  escapeHtml(version) +
                  ' — ' +
                  escapeHtml(date);

            if (isCurrent) {
              content +=
                '<span class="current-label">CURRENT</span>';
            }

            content += '</div>';

            const details = Array.isArray(release.details)
              ? release.details
              : [];

            if (details.length > 0) {
              content += '<ul>';

              details.forEach(function (detail) {
                content +=
                  '<li>' +
                    escapeHtml(detail) +
                  '</li>';
              });

              content += '</ul>';
            }

            content += '</div>';

            if (index < releases.length - 1) {
              content += '<hr>';
            }
          });

          content +=
              '</div>' +
            '</details>';
        }

        if (!content) {
          content =
            '<div class="status">No release information is available.</div>';
        }

        container.innerHTML = content;
      }
      catch (error) {
        console.error("SimFlow release notes error:", error);

        container.innerHTML =
          '<div class="status">' +
            'Release information is temporarily unavailable.' +
          '</div>';
      }
    }

    loadReleaseNotes();
  </script>
</body>
</html>
